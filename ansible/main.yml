# Install required packages
- hosts: all
  roles:
    - dependencies
    - geerlingguy.docker
  tags:
    - dependencies

# Install the sample app
- hosts: all
  name: Deploy reverse-proxy services with docker compose
  tags:
    - app
  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/my-app
        state: directory
        mode: "0755"

    - name: Copy env file to remote server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: /opt/my-app/.env
        mode: "0644"

    - name: Copy Compose file to remote server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose.yaml"
        dest: /opt/my-app/compose.yaml
        mode: "0644"

    - name: Log in to Docker registry
      community.docker.docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_token }}"
        registry_url: https://index.docker.io/v1/

    - name: Deploy sample app
      community.docker.docker_compose_v2:
        project_name: sample-app
        project_src: "/opt/my-app"
        build: never
        pull: always

