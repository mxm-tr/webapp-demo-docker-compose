<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
  </head>
  <body>
    <main>
      <p><a href="{{ .Site.Home.RelPermalink }}">Home</a></p>
      <article>
        <h1>{{ .Title }}</h1>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        {{ .Content }}
      </article>
    </main>
  </body>
</html>
