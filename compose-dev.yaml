services:
  app-dev:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}@db-dev:5432/${POSTGRES_DB:-tasty_crousty_dev}"
    ports:
      - "${DEV_APP_PORT:-3001}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      db-dev:
        condition: service_healthy

  db-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasty_crousty_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tasty_crousty_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data_dev: