services:
  nginx-proxy:
    container_name: nginx-reverse-proxy
    image: nginxproxy/nginx-proxy
    networks:
      - app-network
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
  app:
    image: mxmtr86/docker-course:${APP_IMAGE_TAG:-1.0.0}
    build:
      context: .
      target: app
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tasty_crousty}"
      VIRTUAL_HOST: whoami.local
      VIRTUAL_PORT: "3000"
    networks:
      - app-network
      - db-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mxmtr86/docker-course:${DB_IMAGE_TAG:-postgres-16}
    build:
      context: .
      target: db
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasty_crousty}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - app-network
      - db-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tasty_crousty}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge